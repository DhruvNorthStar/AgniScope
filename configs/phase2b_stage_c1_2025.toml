# Prompt 9 authorizes only calendar-2025 Stage C1, never automatic continuation.
[study]
stage = "C1"
source = "VIIRS_SNPP_SP"
start = "2025-01-01"
end = "2025-12-31"
bbox = [77.5, 28.6, 81.2, 31.6]
allowed_collection_values = ["2", "2.0"]
maximum_days = 5
maximum_response_bytes = 10485760
maximum_new_intervals = 73
maximum_logical_intervals = 73

