[project]
name = "AgniScope AI"
study_start = "2019-01-01"
study_end = "2025-12-31"
study_period_status = "proposed_pending_empirical_verification"

[paths]
immutable_sources = "data/external"
state_boundary = "data/external/boundaries/uttarakhand_boundary.gpkg"
district_boundaries = "data/external/boundaries/uttarakhand_districts.gpkg"
district_aliases = "configs/district_aliases.csv"
analysis_footprint = "data/processed/analysis_footprint.gpkg"
worldcover_raw = "data/external/worldcover/raw"
worldcover_processed_reference = "data/external/worldcover/processed/lulc.tif"
worldcover_legend = "data/external/worldcover/legend.csv"

[spatial]
primary_footprint = "district_union_2021"
analysis_crs = "EPSG:32644"
observation_crs = "EPSG:4326"
district_column = "district"
district_original_column = "district_original"
include_polygon_edges = true
shared_edge_policy = "retain_in_statewide_total_report_ambiguous_district"
snap_or_nearest_assignment = false
near_boundary_distance_m = 375.0

[landcover]
reference_year = 2021
tree_cover_class = 10
nodata = 0
role = "context_and_sensitivity_only"
primary_extraction = "point_sampling_original_tiles"
categorical_resampling = "nearest"
metadata_sample_grid = 512
gdal_cache_mb = 32

[firms]
source = "VIIRS_SNPP_SP"
collection_policy = "one_documented_standard_processing_collection"
api_base = "https://firms.modaps.eosdis.nasa.gov/api"
bbox_west_south_east_north = [77.5, 28.6, 81.2, 31.6]
pilot_start = "2024-04-01"
pilot_days = 5
maximum_days_per_request = 5
maximum_response_bytes = 10485760
credential_environment_variable = "FIRMS_MAP_KEY"
retain_low_confidence_initially = true

# Bounded Phase 1A only; no acquisition or historical model fitting.
[dbscan_pilot]
raw_csv = "data/raw/firms/VIIRS_SNPP_SP_2024-04-01_5days_uttarakhand_bbox.csv"
enriched_parquet = "data/interim/phase0_final_audit/pilot_retained_with_landcover.parquet"
preflight = "outputs/tables/phase1a/preflight.json"
output_dir = "outputs/tables/phase1a"
expected_raw_rows = 613
expected_retained_rows = 346
expected_nominal_rows = 320
expected_tree_rows = 297
analysis_crs = "EPSG:32644"
eps_km = [0.5, 1.0, 2.0]
min_samples = [3, 5, 10]
algorithm = "kd_tree"
metric = "euclidean"
n_jobs = 1
input_order = "ascending_original_logical_csv_record"
temporal_grid_m = 1000.0
temporal_grid_origin_xy_m = [0.0, 0.0]
temporal_representative = "earliest_UTC_timestamp_then_lowest_source_record"
close_pair_thresholds_m = [375.0, 500.0, 1000.0]
earth_radius_m_for_haversine_check = 6371008.8
# Chosen after reviewing all nine settings and sampling sensitivity.
comparison_baseline_eps_km = 1.0
comparison_baseline_min_samples = 3
comparison_baseline_role = "exploratory_reference_for_later_comparison_not_physical_optimum"
